name = "plantcare-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put`):
#   wrangler secret put OPENROUTER_API_KEY

[observability]
enabled = true

# V1 keeps rate-limit + budget tracking client-side.
# Enable KV here if/when we move them server-side post-MVP:
# [[kv_namespaces]]
# binding = "BUDGET"
# id = "<id from `wrangler kv namespace create BUDGET`>"

# E6-001 — Weather cache for Open-Meteo wrapper. 1-hour TTL keyed on lat/lon
# (2-decimal precision ≈ 1.1km grid). The id below is the placeholder bound
# in vitest-pool-workers' miniflare environment; the real id gets swapped in
# during deploy via `wrangler kv namespace create WEATHER_CACHE` and pasted
# here before the next prod ship.
[[kv_namespaces]]
binding = "WEATHER_CACHE"
id = "weather_cache_placeholder"
