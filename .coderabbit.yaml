# CodeRabbit configuration for PlantCare.
# Schema: https://docs.coderabbit.ai/reference/yaml-template
#
# This is a solo + AI-driven repo. We want low-noise review that flags real
# regressions, not stylistic nits. `chill` profile keeps the signal-to-noise
# ratio sane.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  # Skip generated/binary/design artifacts. Lockfiles and PNGs are noise.
  path_filters:
    - "!bun.lock"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!designs/**"
    - "!plans/**"

  # Path-specific guidance — keeps reviews grounded in this project's
  # critical regression areas (see CLAUDE.md and WORKBACK.md E4-002).
  path_instructions:
    - path: "apps/mobile/**"
      instructions: |
        React Native + Expo SDK 55. Flag accessibility regressions, RN-specific
        perf anti-patterns (inline functions in FlatList renderItem, missing
        keyExtractor, unstable component identities re-rendering large trees),
        and missing accessibilityLabel on interactive elements (Pressable,
        TouchableOpacity, custom buttons). Portrait-only — flag any landscape
        assumptions.
    - path: "apps/backend/**"
      instructions: |
        Hono on Cloudflare Workers (free tier). Flag missing input validation
        on request bodies, prompt-injection vectors when user content is
        forwarded to the LLM, secrets read from env that should be read from
        wrangler secrets/KV, and any code path that could OOM the Worker
        (128MB / 50ms CPU on free tier).
    - path: "packages/theme/**"
      instructions: |
        Design tokens. Flag hex values that don't match DESIGN.md, missing
        dark-mode counterparts (every light token must have a Midnight
        counterpart), and any inline color literals that bypass the token
        system.
    - path: "**/__tests__/**"
      instructions: |
        Tests. Flag missing edge cases, especially timezone math (DST
        transitions, international date line crossings) — the project's
        critical regression area is `useWateringEngine` which must use
        millisecond math, never calendar-day math (see WORKBACK.md E4-002).
    - path: "**/test/**"
      instructions: |
        Tests. Flag missing edge cases, especially timezone math (DST
        transitions, international date line crossings) — the project's
        critical regression area is `useWateringEngine` which must use
        millisecond math, never calendar-day math (see WORKBACK.md E4-002).

chat:
  auto_reply: true
