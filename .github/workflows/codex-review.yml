name: Codex Review

# Adversarial AI review pass on every PR targeting main.
# Runs OpenAI Codex CLI's `codex review` against the diff and posts the result
# back to the PR as a single, edit-in-place comment (idempotent per push).
#
# Companion to .coderabbit.yaml — Codex is the second adversarial reviewer.
# Both are advisory; the TL still approves the merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Cancel an older codex review on the same PR if a new push lands.
concurrency:
  group: codex-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-review:
    name: codex review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          # Need the full history so `git diff origin/main...HEAD` can resolve
          # the merge base.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify OPENAI_API_KEY is set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error title=OPENAI_API_KEY missing::OPENAI_API_KEY is not set in repository secrets. See README.md, section 'CI / Code Review', for setup instructions."
            exit 1
          fi
          echo "OPENAI_API_KEY is set (value masked)."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "${BASE_REF}":"refs/remotes/origin/${BASE_REF}"

      - name: Run codex review against base
        id: codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          mkdir -p .codex-out
          # `codex review --base <branch>` reviews the diff between HEAD and the
          # base branch non-interactively. Capture stdout to a file; exit code
          # is informational only — we still want to post whatever review came
          # back. The title is passed via env (never interpolated into the
          # script body) to avoid command-injection from PR titles.
          codex review \
            --base "origin/${BASE_REF}" \
            --title "PR #${PR_NUMBER} — ${PR_TITLE}" \
            > .codex-out/review.md 2>&1 || true
          # Sanity check — never let an empty file silently post.
          if [ ! -s .codex-out/review.md ]; then
            echo "codex produced no output" > .codex-out/review.md
          fi

      - name: Compose PR comment
        id: comment
        env:
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "<!-- codex-review-marker -->"
            echo "## Codex Review"
            echo ""
            echo "_Automated adversarial review by [\`codex review\`](https://github.com/openai/codex). Advisory only — TL approves the merge._"
            echo ""
            echo "<details><summary>Review output (commit \`${SHORT_SHA}\`)</summary>"
            echo ""
            echo '```markdown'
            cat .codex-out/review.md
            echo '```'
            echo ""
            echo "</details>"
          } > .codex-out/comment.md

      - name: Post or update PR comment (idempotent per push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MARKER: "<!-- codex-review-marker -->"
        run: |
          set -euo pipefail
          # Find an existing codex comment by its hidden marker so we can edit
          # it in place rather than spamming a new comment per push.
          existing_id=$(gh api \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))][0].id // empty")

          if [ -n "${existing_id}" ]; then
            echo "Updating existing codex comment id=${existing_id}"
            gh api --method PATCH \
              "repos/${REPO}/issues/comments/${existing_id}" \
              -F body=@.codex-out/comment.md > /dev/null
          else
            echo "Posting new codex comment"
            gh pr comment "${PR_NUMBER}" \
              --repo "${REPO}" \
              --body-file .codex-out/comment.md > /dev/null
          fi
