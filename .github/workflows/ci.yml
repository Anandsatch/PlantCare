name: CI

# Trigger on every push (any branch) and on PRs targeting main.
# Per-ref concurrency cancels older in-flight runs when new commits land.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.workspace }} (typecheck + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [mobile, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Note: `bun run` must come BEFORE `--cwd` (Bun 1.3.x quirk — putting
      # `run` after `--cwd <dir>` makes Bun print its help and exit 0, silently
      # skipping the script).
      - name: Typecheck
        run: bun run --cwd "apps/${WORKSPACE}" typecheck
        env:
          WORKSPACE: ${{ matrix.workspace }}

      - name: Test
        run: bun run --cwd "apps/${WORKSPACE}" test
        env:
          WORKSPACE: ${{ matrix.workspace }}
